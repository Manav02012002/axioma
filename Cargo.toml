[workspace]
resolver = "2"
members = [
  "crates/ax-core-ir",
  "crates/ax-context",
  "crates/ax-codegen",
  "crates/ax-rewrite",
  "crates/ax-trace",
  "crates/ax-diagnostics",
  "crates/ax-cli",
  "crates/ax-equiv",
  "crates/ax-eval",
  "crates/ax-forms",
  "crates/ax-linalg",
  "crates/ax-lsp",
  "crates/ax-jupyter",
  "crates/ax-notebook",
  "crates/ax-ode",
  "crates/ax-perm",
  "crates/ax-plot",
  "crates/ax-qm",
  "crates/ax-render",
  "crates/ax-solve",
  "crates/ax-tensor",
  "crates/ax-units",
  "crates/ax-variational",
  "crates/ax-plugin-host",
  "crates/ax-plugin-api",
  "plugins/axp-echo", "crates/ax-ir", "crates/ax-syntax", "crates/ax-ai-proto",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
indexmap = "2.2"
blake3 = "1.5"
schemars = "0.8"
jsonschema = "0.17"
tracing = "0.1"
tracing-subscriber = "0.3"
lasso = { version = "0.7", features = ["serialize"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
tiny_http = "0.12"
