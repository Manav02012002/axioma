[package]
name = "ax-lsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "axioma-lsp"
path = "src/main.rs"

[dependencies]
ax-ir = { path = "../ax-ir" }
ax-core-ir = { path = "../ax-core-ir" }
ax-eval = { path = "../ax-eval" }
ax-render = { path = "../ax-render" }
ax-syntax = { path = "../ax-syntax" }
lasso = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
