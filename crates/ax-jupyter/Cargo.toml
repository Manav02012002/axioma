[package]
name = "ax-jupyter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "axioma-jupyter"
path = "src/main.rs"

[dependencies]
ax-ir = { path = "../ax-ir" }
ax-core-ir = { path = "../ax-core-ir" }
ax-eval = { path = "../ax-eval" }
ax-render = { path = "../ax-render" }
lasso = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
uuid = { version = "1", features = ["v4"] }
zmq = "0.10"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
