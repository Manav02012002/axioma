[package]
name = "ax-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "axioma-mcp"
path = "src/main.rs"

[dependencies]
ax-ai-proto = { path = "../ax-ai-proto" }
ax-eval = { path = "../ax-eval" }
ax-core-ir = { path = "../ax-core-ir" }
ax-ir = { path = "../ax-ir" }
ax-notebook = { path = "../ax-notebook" }
ax-ode = { path = "../ax-ode" }
ax-plot = { path = "../ax-plot" }
ax-render = { path = "../ax-render" }
ax-syntax = { path = "../ax-syntax" }
ax-tensor = { path = "../ax-tensor" }
ax-qm = { path = "../ax-qm" }
ax-trace = { path = "../ax-trace" }
ax-forms = { path = "../ax-forms" }
ax-variational = { path = "../ax-variational" }
ax-solve = { path = "../ax-solve" }
ax-codegen = { path = "../ax-codegen" }
num-traits = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"], optional = true }
axum = { version = "0.7", optional = true }
tokio-stream = { version = "0.1", optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }

[features]
default = []
http = ["tokio", "axum", "tokio-stream", "tower-http"]
