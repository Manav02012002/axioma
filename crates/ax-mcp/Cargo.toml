[package]
name = "ax-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "axioma-mcp"
path = "src/main.rs"

[dependencies]
ax-eval = { path = "../ax-eval" }
ax-core-ir = { path = "../ax-core-ir" }
ax-ir = { path = "../ax-ir" }
ax-render = { path = "../ax-render" }
ax-syntax = { path = "../ax-syntax" }
ax-tensor = { path = "../ax-tensor" }
ax-qm = { path = "../ax-qm" }
ax-forms = { path = "../ax-forms" }
ax-variational = { path = "../ax-variational" }
ax-solve = { path = "../ax-solve" }
ax-codegen = { path = "../ax-codegen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
