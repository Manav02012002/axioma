[package]
name = "ax-perturb"
version = "0.1.0"
edition = "2021"

[dependencies]
ax-codegen = { path = "../ax-codegen" }
ax-ir = { path = "../ax-ir" }
ax-linalg = { path = "../ax-linalg" }
ax-ode = { path = "../ax-ode" }
ax-solve = { path = "../ax-solve" }
ax-tensor = { path = "../ax-tensor" }
ax-variational = { path = "../ax-variational" }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
lasso = "0.7"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ax-codegen = { path = "../ax-codegen" }
ax-render = { path = "../ax-render" }
