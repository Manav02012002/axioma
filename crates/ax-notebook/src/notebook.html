<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axioma Notebook</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; color: #1a1a1a; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
h1 { font-size: 24px; font-weight: 500; margin-bottom: 20px; color: #333; }
.cell { background: white; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 12px; overflow: hidden; transition: border-color 0.2s; }
.cell:focus-within { border-color: #4a90d9; }
.cell-input { display: flex; align-items: stretch; }
.cell-label { background: #f5f5f5; padding: 8px 12px; font-size: 12px; color: #888; display: flex; align-items: center; min-width: 50px; justify-content: center; border-right: 1px solid #e0e0e0; user-select: none; }
.cell-editor { flex: 1; padding: 10px 14px; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 14px; line-height: 1.6; border: none; outline: none; resize: none; min-height: 40px; background: white; }
.cell-output { padding: 10px 14px 10px 62px; border-top: 1px solid #f0f0f0; background: #fafbfc; min-height: 30px; }
.cell-output .latex-output { font-size: 18px; }
.cell-output .unicode-output { font-family: monospace; font-size: 13px; color: #666; margin-top: 4px; }
.cell-output .error { color: #d32f2f; font-family: monospace; font-size: 13px; }
.cell-output .svg-output { margin-top: 8px; }
.toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
.toolbar button { padding: 6px 16px; border: 1px solid #d0d0d0; border-radius: 6px; background: white; cursor: pointer; font-size: 13px; }
.toolbar button:hover { background: #f0f0f0; }
.add-cell { text-align: center; padding: 8px; cursor: pointer; color: #999; font-size: 13px; border-radius: 6px; }
.add-cell:hover { background: #eee; color: #666; }
</style>
</head>
<body>
<div class="container">
<h1>Axioma Notebook</h1>
<div class="toolbar">
  <button onclick="addCell()">+ New cell</button>
  <button onclick="runAll()">Run all</button>
  <button onclick="resetKernel()">Reset kernel</button>
  <button onclick="exportLatex()">Export LaTeX</button>
  <button onclick="exportHTML()">Export HTML</button>
</div>
<div id="cells"></div>
<div class="add-cell" onclick="addCell()">+ Add cell</div>
</div>
<script>
let cellCount = 0;
const NOTEBOOK_TRUST = {
  currentSession: 'trusted_local',
  importedOrShared: 'untrusted'
};
const SESSION_STORAGE_KEY = 'axiomaNotebookSessionId';
const notebookSessionId = getOrCreateSessionId();

// Browser policy:
// - text and errors are inserted via textContent only
// - SVG from the local kernel is still sanitized before DOM insertion
// - imported/shared notebook content should be treated as untrusted
//   and exported with trust = "untrusted"

function addCell() {
  cellCount++;
  const id = 'cell-' + cellCount;
  const div = document.createElement('div');
  div.className = 'cell';
  div.id = id;
  const input = document.createElement('div');
  input.className = 'cell-input';
  const label = document.createElement('div');
  label.className = 'cell-label';
  label.textContent = `In [${cellCount}]`;
  const textarea = document.createElement('textarea');
  textarea.className = 'cell-editor';
  textarea.rows = 1;
  textarea.placeholder = 'Type Axioma expression...';
  textarea.addEventListener('keydown', (event) => handleKey(event, id));
  textarea.addEventListener('input', () => autoResize(textarea));
  const output = document.createElement('div');
  output.className = 'cell-output';
  output.id = `${id}-output`;
  input.appendChild(label);
  input.appendChild(textarea);
  div.appendChild(input);
  div.appendChild(output);
  document.getElementById('cells').appendChild(div);
  textarea.focus();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function handleKey(e, cellId) {
  if (e.key === 'Enter' && e.shiftKey) {
    e.preventDefault();
    runCell(cellId);
  }
}

async function runCell(cellId) {
  const cell = document.getElementById(cellId);
  const textarea = cell.querySelector('.cell-editor');
  const output = document.getElementById(cellId + '-output');
  const source = textarea.value.trim();
  if (!source) return;

  clearNode(output);
  const pending = document.createElement('span');
  pending.style.color = '#999';
  pending.textContent = 'evaluating...';
  output.appendChild(pending);

  try {
    const resp = await fetch('/eval', {
      method: 'POST',
      headers: notebookHeaders(),
      body: JSON.stringify({ source })
    });
    const data = await resp.json();

    if (data.error) {
      renderError(output, data.error);
    } else {
      renderOutput(output, cellId, data);
    }
  } catch (err) {
    renderError(output, `Connection error: ${err.message}`);
  }

  const cells = document.querySelectorAll('.cell');
  if (cells[cells.length - 1].id === cellId) {
    addCell();
  }
}

async function runAll() {
  const cells = document.querySelectorAll('.cell');
  for (const cell of cells) {
    await runCell(cell.id);
  }
}

async function resetKernel() {
  await fetch('/reset', { method: 'POST', headers: notebookHeaders() });
  document.querySelectorAll('.cell-output').forEach(clearNode);
}

async function exportLatex() {
  const cells = collectCells();
  const resp = await fetch('/export/latex', {
    method: 'POST',
    headers: notebookHeaders(),
    body: JSON.stringify({
      cells,
      title: 'Axioma Notebook',
      author: '',
      trust: NOTEBOOK_TRUST.currentSession
    })
  });
  const text = await resp.text();
  download('notebook.tex', text);
}

async function exportHTML() {
  const cells = collectCells();
  const resp = await fetch('/export/html', {
    method: 'POST',
    headers: notebookHeaders(),
    body: JSON.stringify({
      cells,
      title: 'Axioma Notebook',
      author: '',
      trust: NOTEBOOK_TRUST.currentSession
    })
  });
  const text = await resp.text();
  download('notebook.html', text);
}

function collectCells() {
  const cells = [];
  document.querySelectorAll('.cell').forEach(cell => {
    const textarea = cell.querySelector('.cell-editor');
    const output = cell.querySelector('.cell-output');
    const katexEl = output?.querySelector('.latex-output');
    const unicodeEl = output?.querySelector('.unicode-output');
    cells.push({
      source: textarea?.value || '',
      output_latex: katexEl?.getAttribute('data-latex') || null,
      output_unicode: unicodeEl?.textContent || null,
      cell_type: 'code'
    });
  });
  return cells;
}

function renderError(output, message) {
  clearNode(output);
  const div = document.createElement('div');
  div.className = 'error';
  div.textContent = message;
  output.appendChild(div);
}

function renderOutput(output, cellId, data) {
  clearNode(output);

  if (data.latex) {
    const katexEl = document.createElement('div');
    katexEl.className = 'latex-output';
    katexEl.id = `${cellId}-katex`;
    output.appendChild(katexEl);
    try {
      katex.render(data.latex, katexEl, {
        displayMode: true, throwOnError: false
      });
      katexEl.setAttribute('data-latex', data.latex);
    } catch (err) {
      katexEl.textContent = data.latex;
    }
  }

  if (data.unicode) {
    const unicodeEl = document.createElement('div');
    unicodeEl.className = 'unicode-output';
    unicodeEl.textContent = data.unicode;
    output.appendChild(unicodeEl);
  }

  if (data.svg) {
    const svgEl = document.createElement('div');
    svgEl.className = 'svg-output';
    appendSanitizedSvg(svgEl, data.svg);
    output.appendChild(svgEl);
  }
}

function clearNode(node) {
  while (node.firstChild) {
    node.removeChild(node.firstChild);
  }
}

function appendSanitizedSvg(target, svgMarkup) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(svgMarkup, 'image/svg+xml');
  const svg = doc.documentElement;
  if (!svg || svg.nodeName.toLowerCase() !== 'svg') {
    target.textContent = 'Blocked unsafe SVG output';
    return;
  }
  const sanitized = sanitizeSvgElement(svg);
  if (!sanitized) {
    target.textContent = 'Blocked unsafe SVG output';
    return;
  }
  target.appendChild(sanitized);
}

function sanitizeSvgElement(node) {
  const allowedTags = new Set([
    'svg', 'g', 'path', 'circle', 'ellipse', 'line', 'polyline', 'polygon', 'rect',
    'text', 'tspan', 'defs', 'clipPath', 'linearGradient', 'radialGradient', 'stop',
    'title', 'desc'
  ]);
  const allowedAttrs = new Set([
    'xmlns', 'viewBox', 'width', 'height', 'x', 'y', 'x1', 'y1', 'x2', 'y2', 'cx', 'cy',
    'r', 'rx', 'ry', 'd', 'points', 'fill', 'fill-opacity', 'stroke', 'stroke-width',
    'stroke-opacity', 'stroke-linecap', 'stroke-linejoin', 'transform', 'opacity',
    'font-size', 'font-family', 'text-anchor', 'class', 'id', 'offset', 'stop-color',
    'stop-opacity', 'gradientUnits', 'gradientTransform', 'clip-path', 'xmlns:xlink',
    'xlink:href', 'href'
  ]);
  const tag = node.nodeName;
  if (!allowedTags.has(tag)) {
    return null;
  }
  const clean = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const attr of Array.from(node.attributes || [])) {
    const name = attr.name;
    const value = attr.value;
    if (name.startsWith('on') || !allowedAttrs.has(name)) {
      continue;
    }
    if ((name === 'href' || name === 'xlink:href') && !value.trim().startsWith('#')) {
      continue;
    }
    clean.setAttribute(name, value);
  }
  for (const child of Array.from(node.childNodes)) {
    if (child.nodeType === Node.TEXT_NODE || child.nodeType === Node.CDATA_SECTION_NODE) {
      clean.appendChild(document.createTextNode(child.textContent || ''));
      continue;
    }
    if (child.nodeType === Node.ELEMENT_NODE) {
      const sanitizedChild = sanitizeSvgElement(child);
      if (sanitizedChild) {
        clean.appendChild(sanitizedChild);
      }
    }
  }
  return clean;
}

function download(filename, text) {
  const a = document.createElement('a');
  a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(text);
  a.download = filename;
  a.click();
}

function getOrCreateSessionId() {
  const existing = sessionStorage.getItem(SESSION_STORAGE_KEY);
  if (existing) {
    return existing;
  }
  const created = (crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : `axioma-${Date.now()}-${Math.random().toString(16).slice(2)}`;
  sessionStorage.setItem(SESSION_STORAGE_KEY, created);
  return created;
}

function notebookHeaders() {
  return {
    'Content-Type': 'application/json',
    'X-Axioma-Session': notebookSessionId
  };
}

addCell();
</script>
</body>
</html>
