[package]
name = "ax-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "axioma"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
jsonschema = { workspace = true }
blake3.workspace = true
clap = { version = "4.5", features = ["derive"] }

ax-context = { path = "../ax-context" }
ax-diagnostics = { path = "../ax-diagnostics" }
ax-trace = { path = "../ax-trace" }
ax-plugin-api = { path = "../ax-plugin-api" }
ax-plugin-host = { path = "../ax-plugin-host" }
ax-syntax = { version = "0.1.0", path = "../ax-syntax" }
serde = { workspace = true, features = ["derive"] }
ax-ai-proto = { version = "0.1.0", path = "../ax-ai-proto" }
ax-ir = { path = "../ax-ir" }
ax-core-ir = { path = "../ax-core-ir" }
ax-eval = { path = "../ax-eval" }
ax-render = { path = "../ax-render" }
rustyline = "15"

[dev-dependencies]
wat = "1.0"
blake3 = { workspace = true }
