[package]
name = "ax-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "axioma"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
blake3 = { workspace = true }
clap = { version = "4.5", features = ["derive"] }

ax-context = { path = "../ax-context" }
ax-diagnostics = { path = "../ax-diagnostics" }
ax-trace = { path = "../ax-trace" }

[dev-dependencies]
blake3 = { workspace = true }
